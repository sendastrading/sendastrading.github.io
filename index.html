<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sendas Armazéns Gerais</title>
    <link rel="alternate" hreflang="pt-BR" href="https://sendastrading.com.br/armazensgerais/index.html">
    <link rel="alternate" hreflang="en" href="https://sendastrading.com.br/armazensgerais/en/index.html">
    <link rel="alternate" hreflang="x-default" href="https://sendastrading.com.br/armazensgerais/en/index.html">
</head>
<body>
    <script>
        // Escolha salva na bandeira (js/index.js) tem prioridade; senao usa o idioma do browser.
        var lang = null
        try {
            lang = localStorage.getItem("sendasLang")
        } catch (e) {}
        if (lang !== "pt" && lang !== "en") {
            var browserLang = (navigator.language || navigator.userLanguage || "").toLowerCase()
            lang = browserLang.indexOf("pt") === 0 ? "pt" : "en"
        }
        window.location.replace(lang === "pt" ? "armazensgerais/index.html" : "armazensgerais/en/index.html")
    </script>
    <noscript>
        <p><a href="armazensgerais/index.html">Português</a> | <a href="armazensgerais/en/index.html">English</a></p>
    </noscript>
</body>
</html>
