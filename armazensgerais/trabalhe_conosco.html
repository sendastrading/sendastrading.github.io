    <body>
        <!--Header&Menu-->
        <div class="navbar-fixed">
                <nav>
                    <div class="nav-wrapper HeaderFixo">

        <!--Header&Menu-->

        <section class="main">
            <div class="container">
                <div class="box">
                    <div class="container">
                        <br></br>
                        <h5>Preencha os campos à seguir e nos envie seu currículo em anexo.</h5>
                        <br></br>
                        <br></br>
                        <div class="formContato">
                            <form action="https://formspree.io/f/contatositearmazem@sendastrading.com.br" method="POST" enctype="multipart/form-data">
                                <!--row1-->
                                <div class="row">
                                    <div class="input-field col s12 m4">
                                        <label for="nome"  class="visuallyhidden">Seu Nome:</label>
                                        <input type="text" name="nome" id="Nome" class="name" placeholder="Seu Nome" required>
                                    </div>
                                    <div class="input-field col s12 m4">
                                        <label for="email"  class="visuallyhidden">Seu Email:</label>
                                        <input type="email" name="email" id="email" class="email" placeholder="Seu Email" required>
                                    </div>
                                    <div class="input-field col s12 m4">
                                        <label for="telefone"  class="visuallyhidden">Telefone:</label>
                                        <input type="text" name="telefone" id="telefone" placeholder="Telefone" maxlength="15" required>
                                    </div>
                                </div>
                                <!--row2-->
                                <div class="row">
                                    <div class="input-field col s12">
                                        <label for="cargo"  class="visuallyhidden">Cargo Pretendido:</label>
                                        <input type="text" name="cargo" id="cargo" placeholder="Cargo Pretendido" required>
                                    </div>
                                </div>
                                <!--row3-->
                                <div class="row">                                  
                                    <div class="input-field col s12">
                                        <label for="mensagem"  class="visuallyhidden">Deixe aqui uma breve descrição sobre seu perfil profisional:</label>
                                        <textarea name="mensagem" id="mensagem" cols="1" rows="1" class="materialize-textarea" placeholder="Deixe aqui uma breve descrição sobre seu perfil profisional" required></textarea>   
                                    </div>
                                </div>
                                <!--row4-->
                                <div class="row">
                                    <div class="col s12">
                                        <h5>Não esqueça de anexar seu currículo em pdf:</h5> 
                                        <br>
                                        <input type="hidden" role="uploadcare-uploader" name="anexos"
                                        data-crop="disabled" data-file-types="pdf" required/>
                                    </div>
                                </div>
                                <!--row5-->
                                <div class="row">                           
                                        <br></br>
                                    <div class="col s12">
                                        <button type="submit" method="post" name="" value="Enviar Mensagem" id="submitbtn" onclick="" class="btn green darken-3">Enviar</button>
                                    </div>
                                    <input type="hidden" name="_next" value="/armazensgerais/obrigado_contato.html">
                                    <input type="hidden" name="_subject" value="Nova mensagem registrada no Site!">         
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
